name: CI/CD - Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  filter:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Paths for Changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'render.yaml'
              - 'pyproject.toml'
              - '.github/workflows/deploy.yml'

  deploy-backend:
    name: Deploy Backend to Render
    needs: [filter]
    if: needs.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping Render backend deployment."
            echo "To enable automated Render deployment:"
            echo "  1. Go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "  2. Add RENDER_DEPLOY_HOOK_URL with your Render Deploy Hook URL"
            exit 0
          fi

          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deploy triggered successfully (HTTP $HTTP_STATUS)!"
            echo "Response: $BODY"
          else
            echo "::error::Render deploy hook failed with status $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi
