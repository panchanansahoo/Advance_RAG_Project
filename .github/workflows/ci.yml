name: CI - Tests & Lint

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OCR & Imaging)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip check

      - name: Verify Backend Code Compilation
        run: |
          python -m compileall backend/

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
        env:
          APP_ENV: test
          DEBUG: true
          AUTH_SECRET: ci-test-secret
          DATABASE_PROVIDER: sqlite
          VECTOR_DB_PROVIDER: chroma
          ROUTING_PROVIDER: heuristic

      - name: Check Frontend JavaScript Syntax
        run: |
          node --check vanilla_frontend/app.js
