services:
  - type: web
    name: advanced-rag-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon # Supported: oregon, ohio, frankfurt, singapore
    plan: starter # Options: 'free' or 'starter' (starter recommended for memory-intensive PDF/OCR)
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: '["*"]' # Allows requests from Vercel frontend
      - key: LLM_PROVIDER
        value: openai # 'openai', 'gemini', or 'groq'
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: VECTOR_DB_PROVIDER
        value: qdrant
      - key: DATABASE_PROVIDER
        value: sqlite
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard -> Environment
      - key: GOOGLE_API_KEY
        sync: false # Optional, set if using Gemini
      - key: GROQ_API_KEY
        sync: false # Optional, set if using Groq
