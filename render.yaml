services:
  - type: web
    name: advance-rag-project
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon # Supported: oregon, ohio, frankfurt, singapore
    plan: starter # Options: 'free' or 'starter' (starter recommended for memory-intensive PDF/OCR)
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: '["*"]' # Allows requests from Vercel frontend
      - key: LLM_PROVIDER
        value: gemini # 'gemini', 'openai', or 'groq'
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: gemini # API-based embeddings require ~0 MB RAM on Render
      - key: EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: VECTOR_DB_PROVIDER
        value: chroma # Local persistent vector store
      - key: DATABASE_PROVIDER
        value: sqlite # Override with DATABASE_URL in Dashboard for Supabase persistence
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard -> Environment
      - key: GOOGLE_API_KEY
        sync: false # Optional, set if using Gemini
      - key: GROQ_API_KEY
        sync: false # Optional, set if using Groq
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard (e.g. https://<project-ref>.supabase.co)
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard (anon public key)
